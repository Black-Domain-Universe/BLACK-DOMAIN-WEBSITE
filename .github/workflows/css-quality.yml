name: CSS Quality

on:
  pull_request:
    branches: [EL]
  push:
    branches: [EL]

permissions:
  contents: read

jobs:
  lint-css:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint CSS
        run: npm run lint:css
