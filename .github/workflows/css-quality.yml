name: CSS Quality

on:
  pull_request:
  push:
    branches: [EL]

permissions:
  contents: read

jobs:
  css-quality:
    name: css-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:css
      - run: npm run build
